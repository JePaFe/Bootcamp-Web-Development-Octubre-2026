<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Museo del barrio</title>
  </head>
  <body>
    <header><p>Museo del barrio</p></header>

    <nav>
      <a href="#visita">Ver visita</a>
      <a href="visita.html">Visita completa</a>
    </nav>

    <main>
      <h1>Museo del barrio</h1>

      <section>
        <h2 id="visita">Visita del sábado</h2>
        <p>Entrada a las 11:00.</p>
      </section>

      <section>
        <h2>Antes de visitar</h2>
        <ul>
          <li>Llegá diez minutos antes.</li>
        </ul>
      </section>

      <table>
        <caption>
          Visitas
        </caption>
        <thead>
          <tr>
            <th scope="col">Día</th>
            <th scope="col">Hora</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Sábado</th>
            <td>11:00</td>
          </tr>
        </tbody>
      </table>

      <form action="#prueba" method="get">
        <label for="entradas">Entradas (de 1 a 3)</label>
        <input
          type="number"
          id="entradas"
          name="entradas"
          min="1"
          max="3"
          required
        />

        <label for="recorrido">Recorrido</label>
        <select name="recorrido" id="recorrido" required>
          <option value="">Elegí recorrido</option>
          <option value="patio">Patio</option>
        </select>

        <button type="submit">Probar visita</button>
      </form>
      <p id="prueba">Prueba local; no compra entradas.</p>
    </main>

    <footer><p>Datos ficticios.</p></footer>
  </body>
</html>
