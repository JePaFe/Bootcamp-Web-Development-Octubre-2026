<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
  </head>
  <body>
    <main>
      <h1>Contacto</h1>
      <p>
        Prototipo de práctica: no envía ni guarda datos. Usá solo datos
        ficticios.
      </p>
      
      <form>
        <div>
            <label for="contacto-nombre">Nombre: </label>
            <input type="text" id="contacto-nombre" name="contacto_nombre" />
        </div>
        
        <div>
            <label for="contacto-correo">Correo: </label>
            <input type="email" id="contacto-correo" name="contacto_correo" />
        </div>

        <button type="button">Probar contacto</button>
      </form>
    </main>
  </body>
</html>
