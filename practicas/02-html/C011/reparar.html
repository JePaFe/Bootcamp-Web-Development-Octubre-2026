<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción para revisar</title>
  </head>
  <body>
    <main>
      <h1>Inscripción para revisar</h1>
      <p>
        Prototipo de práctica: no envía ni guarda datos. Usá solo datos
        ficticios.
      </p>
      <form>
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" />
        </div>

        <div>
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" />
        </div>

        <div>
          <label for="codigo">Código de invitación (opcional)</label>
          <input type="text" id="codigo" name="codigo" />
        </div>

        <button type="button">Probar inscripción</button>

        <!-- <input type="button" value="Probar inscripción" /> -->
      </form>
    </main>
  </body>
</html>
