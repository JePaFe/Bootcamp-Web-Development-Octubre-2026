<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login de práctica</title>
  </head>
  <body>
    <main>
      <h1>Login de práctica</h1>
      <p>
        Prototipo de práctica: no envía ni guarda datos. Usá solo datos
        ficticios.
      </p>

      <form>
        <div>
          <label for="registro-correo">Correo</label>
          <input type="email" id="registro-correo" name="registro_correo" />
        </div>

        <div>
          <label for="registro-contrasena">Contraseña</label>
          <input
            type="password"
            id="registro-contrasena"
            name="registro_contrasena"
          />
        </div>

        <button type="submit">Probar acceso</button>
      </form>
    </main>
  </body>
</html>
