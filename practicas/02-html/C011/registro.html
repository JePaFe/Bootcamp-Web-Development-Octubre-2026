<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de práctica</title>
  </head>
  <body>
    <main>
      <h1>Registro de práctica</h1>
      <p>
        Prototipo de práctica: no envía ni guarda datos. Usá solo datos
        ficticios.
      </p>

      <form>
        <div>
          <label for="registro-usuario">Nombre de usuario</label>
          <input type="text" id="registro-usuario" name="registro_usuario" />
        </div>

        <div>
          <label for="registro-correo">Correo</label>
          <input type="email" id="registro-correo" name="registro_correo" />
        </div>

        <div>
          <label for="registro-correo-confirmacion">Confirmar correo</label>
          <input
            type="email"
            id="registro-correo-confirmacion"
            name="registro_correo_confirmacion"
          />
        </div>

        <div>
          <label for="registro-contrasena">Contraseña</label>
          <input
            type="password"
            id="registro-contrasena"
            name="registro_contrasena"
          />
        </div>

        <div>
          <label for="registro-contrasena-confirmacion"
            >Confirmar contraseña</label
          >
          <input
            type="password"
            id="registro-contrasena-confirmacion"
            name="registro_contrasena_confirmacion"
          />
        </div>

        <button type="button">Probar registro</button>
      </form>
    </main>
  </body>
</html>
