<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitar aviso de disponibilidad</title>
  </head>
  <body>
    <main>
      <h1>Solicitar aviso de disponibilidad</h1>
      <p>
        Prototipo de práctica: no envía ni guarda datos ni solicitudes. Usá solo
        datos ficticios.
      </p>

      <form>
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" />
        </div>

        <div>
          <label for="correo">Correo para el aviso</label>
          <input type="email" id="correo" name="correo" />
        </div>

        <div>
          <label for="titulo">Título del libro</label>
          <input type="text" id="titulo" name="titulo" />
        </div>

        <button type="button">Probar solicitud</button>
      </form>
    </main>
  </body>
</html>
