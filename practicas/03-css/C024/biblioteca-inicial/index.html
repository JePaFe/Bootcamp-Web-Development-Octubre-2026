<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteca La Esquina</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <main>
      <header class="cabecera">
        <h1>Biblioteca La Esquina</h1>
        <nav class="menu" aria-label="Biblioteca">
          <a href="#prestamos">Préstamos</a>
          <a href="#sala">Sala de lectura</a>
        </nav>
      </header>
      <div class="tablero">
        <article id="prestamos">
          <h2>Préstamos</h2>
          <img
            src="img/mapa.svg"
            width="960"
            height="320"
            alt="Plano del barrio con la plaza al oeste y el río al este"
          />
          <p>Retirá hasta tres libros por dos semanas.</p>
        </article>
        <article id="sala">
          <h2>Sala de lectura</h2>
          <p>Abierta de lunes a viernes, de 16 a 20.</p>
        </article>
        <article>
          <h2>Contacto</h2>
          <p>Escribinos a contacto@bibliotecaesquina.com</p>
        </article>
      </div>
    </main>
  </body>
</html>
