<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio Patio — jornada abierta</title>
    <link rel="stylesheet" href="css/jornada.css" />
  </head>
  <body>
    <header><h1>Radio Patio: jornada abierta</h1></header>
    <main>
      <article class="programa">
        <h2>Historias del barrio</h2>
        <p class="sinopsis">
          Una escucha compartida de relatos grabados por vecinas y vecinos.
        </p>
        <p class="acceso">Entrada gratuita hasta completar la sala.</p>
      </article>
      <p class="horario">Sábado, de 17:00 a 18:00. Sala del parque.</p>
      <button class="inscripcion" type="button">
        Consultar inscripción (simulación)
      </button>
    </main>
    <footer><p>Prototipo local: el botón no envía ni guarda datos.</p></footer>
  </body>
</html>
