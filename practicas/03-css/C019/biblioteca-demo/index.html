<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteca del barrio</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="barra-biblioteca">Biblioteca del barrio</header>
    <main>
      <h1>Biblioteca del barrio</h1>
      <p>
        <strong>Hoy:</strong> lectura en el patio.
        <a class="cartel" href="#sala">Ver sala</a>
      </p>
      <img
        class="plano"
        src="img/plano.svg"
        alt="Plano con dos salas y un pasillo"
      />
      <h2 id="sala">Sala de lectura <span class="sello">Abierta</span></h2>
      <p>La entrada queda junto al patio.</p>

      <div class="contenedor-plano">
        <img
          class="plano"
          src="img/plano.svg"
          alt="Plano con dos salas y un pasillo"
        />
        <span class="indicador">Plano interior</span>
        <img class="indicador-2" src="img/plano.svg" alt="" width="150" />
      </div>
    </main>
    <footer>
      <p>Biblioteca del barrio · Información para lectores</p>
    </footer>

    <a class="acceso-fijo" href="#">Ver sala</a>
  </body>
</html>
