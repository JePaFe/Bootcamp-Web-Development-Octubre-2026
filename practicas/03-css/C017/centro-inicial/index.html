    <h1>Centro Cultural La Estación</h1>
    <section class="aviso">

      <p>El taller se hará el sábado en la sala del patio. La entrada es gratuita y hay doce plazas.</p>
      <p class="horario">Sábado, 11:00 a 12:30</p>

      <h2>Qué traer</h2>
